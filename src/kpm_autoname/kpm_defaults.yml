# Keypoint-MoSeq modelling settings of the reference model (keypoint-moseq 0.6.6 config.yml).
# Body parts, skeleton, video folder, fps, outlier_scale_factor, latent_dim and kappa are set from the run
# config; sigmasq_loc is estimated from the data at fit time. Change anything else via kpm.config_overrides.
added_noise_level: 0.1
PCA_fitting_num_frames: 1000000
conf_threshold: 0.5
error_estimator:
  intercept: 0.25
  slope: -0.5
obs_hypparams:
  nu_s: 5
  nu_sigma: 100000.0
  sigmasq_0: 0.1
  sigmasq_C: 0.1
ar_hypparams:
  K_0_scale: 10.0
  S_0_scale: 0.01
  latent_dim: 4
  nlags: 3
trans_hypparams:
  alpha: 5.7
  gamma: 1000.0
  kappa: 1000000.0
  num_states: 100
recording_name_suffix: ''
verbose: false
conf_pseudocount: 0.001
keypoint_colormap: autumn
whiten: true
fix_heading: false
fps: 20
outlier_scale_factor: 6.0
